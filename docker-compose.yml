services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botforge
      POSTGRES_PASSWORD: botforge
      POSTGRES_DB: botforge
    ports:
      - "5432:5432"
    volumes:
      - botforge-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - botforge-redis:/data

volumes:
  botforge-postgres:
  botforge-redis:
